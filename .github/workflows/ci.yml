name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: control/go.mod
          cache-dependency-path: control/go.sum

      - name: Go unit tests
        working-directory: control
        run: go test -v ./...

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust unit tests (worker)
        working-directory: worker
        run: cargo test --bin atlas-worker

      - name: Rust unit tests (ct-ingestor)
        working-directory: worker
        run: cargo test --bin atlas-ct-ingestor

  build:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: control/go.mod
          cache-dependency-path: control/go.sum

      - name: Build control-api
        working-directory: control
        run: go build -v ./...

      - uses: dtolnay/rust-toolchain@stable

      - name: Build workers
        working-directory: worker
        run: |
          cargo build --release --bin atlas-worker
          cargo build --release --bin atlas-ct-ingestor

  integration:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up --build -d

      - name: Wait for API
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8090/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Run e2e
        run: bash tests/e2e.sh

      - name: Tear down
        if: always()
        run: docker compose down -v
